<!doctype html><meta charset="utf-8"><title>StackQueue</title><style>body{margin:0;background:#fbfbf9;padding:24px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}svg{width:1100px;height:auto;display:block}</style><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 270" style="width:100%;height:auto;display:block" role="img" aria-label="A stack and a queue, after the same three pushes"><defs><marker id="arrowEnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f9dad"></path></marker><marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d33a1c"></path></marker></defs><g transform="translate(30 0)"><text x="130" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#5c6462">stack — last in, first out</text><g><rect x="80" y="40" width="100" height="32" fill="rgba(211,58,28,0.10)" stroke="#d33a1c" stroke-width="1.6" opacity="1"></rect><text x="130" y="56" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#d33a1c" opacity="1">9</text></g><g><rect x="80" y="74" width="100" height="32" fill="#fbfbf9" stroke="#0f1413" stroke-width="1.6" opacity="1"></rect><text x="130" y="90" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0f1413" opacity="1">4</text></g><g><rect x="80" y="108" width="100" height="32" fill="#fbfbf9" stroke="#0f1413" stroke-width="1.6" opacity="1"></rect><text x="130" y="124" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0f1413" opacity="1">7</text></g><g><line x1="230" y1="40" x2="190" y2="52" stroke="#d33a1c" stroke-width="1.8" marker-end="url(#arrowAcce
