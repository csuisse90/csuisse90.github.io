<!doctype html><meta charset="utf-8"><title>CallStackFrames</title><style>body{margin:0;background:#fbfbf9;padding:24px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}svg{width:1100px;height:auto;display:block}</style><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" style="width:100%;height:auto;display:block" role="img" aria-label="What recursion actually builds"><defs><marker id="arrowEnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f9dad"></path></marker><marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d33a1c"></path></marker></defs><g transform="translate(30 0)"><text x="150" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#5c6462">going down: calls pile up</text><text x="430" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#5c6462">coming back: values return</text><g><rect x="60" y="154" width="180" height="32" fill="#fbfbf9" stroke="#d33a1c" stroke-width="1.7"></rect><text x="150" y="170" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#d33a1c">factorial(1)</text><text x="340" y="170" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#949b99">returns 1</text></g><g><rect x="60" y="114" width="180" height="32" fill="#fbfbf9" stroke="#0f1413" stroke-width="1.7"></rect><text x="150" y="130" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0f1413">factorial(2)</text><text x="340" y="130" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#949b99">returns 2 × 1 = 2</text></g><g><rect x="60" y="74" width="180" height="32" fill="#fbfbf9" stroke="#0f1413" stroke-width="1.7"></rect><text x="150" y="90" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0f1413">factorial(3)</text><text x="340" y="90" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#949b99">returns 3 × 2 = 6</text></g><g><rect x="60" y="34" width="180" height="32" fill="#fbfbf9" stroke="#0f1413" stroke-width="1.7"></rect><text x="150" y="50" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#0f1413">factorial(4)</text><text x="340" y="50" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#949b99">returns 4 × 6 = 24</text></g><g><line x1="44" y1="40" x2="44" y2="148" stroke="#6f9dad" stroke-width="1.8" marker-end="url(#arrowEnd)"></line></g><g><line x1="266" y1="156" x2="266" y2="48" stroke="#d33a1c" stroke-width="1.8" marker-end="url(#arrowAccent)"></line></g><text x="150" y="200" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#d33a1c">base case: factorial(1) returns without calling again</text><text x="280" y="224" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#949b99">remove the base case and the stack grows until the program dies</text></g></svg>
