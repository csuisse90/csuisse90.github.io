name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The WebAssembly engine and the generated circuit data are committed, so
      # CI needs neither emscripten nor a C++ toolchain. Regenerate them with
      # ./core/build.sh and bun run scripts/generate.ts when the C++ changes.
      - name: Build static site
        # `bun run build` regenerates the content manifest and the assistant's
        # site map, then writes the service worker's precache list — all of
        # which must match the export that is about to be uploaded.
        run: bun run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
